  <text x="360" y="158" fill="#fff7ef" font-family="Arial, sans-serif" font-size="62" font-weight="800" letter-spacing="4">LOS</text>
  <text x="360" y="228" fill="#ffb08e" font-family="Arial, sans-serif" font-size="62" font-weight="800" letter-spacing="2">MALDITOS</text>
